<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Esta página no existe — Saneas®</title>
<link rel="canonical" href="https://saneas.es/">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/manrope-200-800-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/quicksand-700-latin.woff2">
<style>
@font-face{font-family:'Manrope';font-style:normal;font-weight:200 800;font-display:swap;
  src:url(/assets/fonts/manrope-200-800-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Quicksand';font-style:normal;font-weight:700;font-display:swap;
  src:url(/assets/fonts/quicksand-700-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}

:root{
  --teal:#3890A4; --teal-ui:#307c8d; --teal-dark:#1a5a6a;
  --orange:#F5862E; --text:#17343c; --gray:#66757a;
  --fs-sm:14px; --fs-base:16px; --fs-md:18px; --fs-lg:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Manrope',sans-serif;background:#fff;color:var(--text);
  min-height:100svh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
:where(a,button):focus-visible{outline:3px solid var(--text);outline-offset:3px;border-radius:4px}

header{
  display:flex;align-items:center;padding:0 40px;height:64px;
  border-bottom:1px solid rgba(0,0,0,0.06);
}
a.logo{
  font-family:'Quicksand',sans-serif;font-weight:700;font-size:20px;
  color:var(--teal-ui);text-decoration:none;letter-spacing:-0.3px;
  display:inline-flex;align-items:center;min-height:44px;
}
a.logo sup{font-size:11px;font-weight:700;margin-left:1px}

main{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:80px 40px;max-width:1100px;margin:0 auto;width:100%;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;align-self:flex-start;
  background:rgba(56,144,164,0.1);border:1px solid rgba(56,144,164,0.25);
  color:var(--teal-dark);font-size:clamp(15px,1.7vw,17px);font-weight:700;
  padding:11px 24px;border-radius:999px;letter-spacing:0.4px;margin-bottom:28px;
}
.eyebrow span{width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0}
h1{
  font-size:clamp(40px,6vw,72px);font-weight:800;letter-spacing:-2.5px;
  line-height:1.06;margin-bottom:20px;
}
h1 em{font-style:normal;color:#d87628}
p.sub{font-size:clamp(17px,2vw,22px);color:var(--gray);font-weight:500;max-width:52ch;margin-bottom:44px}

.enlaces{display:flex;gap:14px;flex-wrap:wrap}
.enlaces a{
  display:inline-flex;align-items:center;min-height:44px;
  text-decoration:none;font-weight:800;font-size:var(--fs-base);
  padding:13px 28px;border-radius:999px;
}
.principal{background:var(--orange);color:var(--text)}
.principal:hover{background:#ff9445}
.secundario{border:2px solid var(--teal-ui);color:var(--teal-ui)}
.secundario:hover{background:var(--teal-ui);color:#fff}

footer{
  padding:28px 40px;border-top:1px solid rgba(0,0,0,0.06);
  font-size:var(--fs-sm);color:var(--gray);text-align:center;
}
@media(max-width:600px){
  header,main,footer{padding-left:24px;padding-right:24px}
  main{padding-top:56px;padding-bottom:56px}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/">Saneas<sup>®</sup></a>
</header>

<main>
  <div class="eyebrow"><span></span>Error 404</div>
  <h1>Esta página<br><em>no existe.</em></h1>
  <p class="sub">O la dirección está mal escrita, o la hemos movido. Ninguna de las dos es culpa tuya.</p>
  <div class="enlaces">
    <a class="principal" href="/">Ir al inicio →</a>
    <a class="secundario" href="/instala-app">Instalar la app</a>
  </div>
</main>

<footer>© 2026 Saneas® · Nutrición online personalizada</footer>

</body>
</html>
