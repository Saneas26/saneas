<style>
  :root {
    --teal-dark: #2a6d7c;
    --orange: #F5862E;
    --text: #1a2e35;
    --text-muted: #56747e;
    --border: #d0e8ee;
    --bg: #f7fbfc;
    --white: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  /* HEADER */
  .site-header { background: var(--white); border-bottom: 1px solid var(--border); padding: 18px 24px; display: flex; align-items: center; gap: 10px; }
  .site-header > a { min-height: 44px; }
  .logo-text { font-family: 'Quicksand', sans-serif; font-size: 22px; color: var(--teal-dark); letter-spacing: -0.5px; }
  .logo-dot { width: 8px; height: 8px; background: var(--orange); border-radius: 50%; margin-bottom: 2px; }

  /* LAS TRES PUERTAS (14/09/2026): Google Play, App Store y la web.
     Las tres insignias miden lo mismo; la de la web copia la forma de las oficiales. */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 48px 20px; text-align: center; }
  .titulo h1 { font-family: 'Quicksand', sans-serif; font-size: clamp(34px, 7vw, 52px); line-height: 1.1; color: var(--teal-dark); letter-spacing: -0.5px; }
  .titulo h1 span { color: #ad5910; }  /* naranja de TEXTO de la web (5:1); el #F5862E de marca no llega a 3:1 sobre este fondo */
  .titulo .lema { margin-top: 10px; font-size: clamp(18px, 3.4vw, 22px); font-weight: 600; color: var(--text); text-wrap: balance; }
  .titulo .guia { margin-top: 8px; font-size: 16px; color: var(--text-muted); text-wrap: balance; }
  .badges { list-style: none; display: flex; flex-direction: column; gap: 18px; align-items: center; }
  @media (min-width: 760px) { .badges { flex-direction: row; gap: 22px; } }
  .badge {
    display: flex; align-items: center; gap: 12px;
    width: 232px; height: 70px; padding: 0 18px;
    background: #000; color: #fff; text-decoration: none;
    border: 1px solid #a6a6a6; border-radius: 12px;
    transition: transform 160ms ease-out;
  }
  .badge svg { width: 34px; height: 34px; flex: 0 0 auto; }
  .badge .t1 { display: block; font-size: 12px; letter-spacing: .3px; line-height: 1.1; text-align: left; }
  .badge .t2 { display: block; font-size: 25px; font-weight: 600; line-height: 1.1; letter-spacing: -.3px; text-align: left; white-space: nowrap; }
  .badge:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .badge:hover { transform: translateY(-2px); } }
  :where(a):focus-visible { outline: 3px solid var(--text); outline-offset: 3px; border-radius: 12px; }
  @media (prefers-reduced-motion: reduce) { .badge { transition: none; } }

  /* FOOTER */
  .page-footer { text-align: center; padding: 24px; font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--border); }
  .page-footer a { color: var(--teal-dark); text-decoration: none; }
</style>
